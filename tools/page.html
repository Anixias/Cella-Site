<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" type="image/x-icon" href="../img/favicon.ico">
<link rel="stylesheet" href="docs.css?v=3">
<script>
try {
	var theme = localStorage.getItem("theme");
	if (theme === "light" || (!theme && matchMedia("(prefers-color-scheme: light)").matches))
		document.documentElement.classList.add("light-mode");
} catch (e) {}
</script>
</head>
<body>
<header class="topbar">
	<button class="menu-button" type="button" aria-label="Chapters"></button>
	<a class="brand" href="index.html"><img src="../img/cella.png" alt="">Cella Documentation</a>
	<span class="version">{{version}}</span>
	<div class="search">
		<input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
		<div id="search-results" hidden></div>
	</div>
	<a class="home" href="../index.html">Home</a>
	<a class="source" href="https://github.com/Anixias/Cella" target="_blank" rel="noopener">Source</a>
	<button class="theme-button" type="button" aria-label="Toggle theme"></button>
</header>
<div class="layout">
<nav class="chapters">
{{sidebar}}
</nav>
<main>
<article class="content">
{{content}}
</article>
{{pager}}
</main>
<aside class="toc">
{{toc}}
</aside>
</div>
<div id="message"></div>
<script src="search-index.js"></script>
<script src="docs.js?v=3"></script>
</body>
</html>
